{% extends 'base.html' %}

{% block css %}
    <link rel="stylesheet" href="../static/signup.css">
{% endblock %}

{% block content %}
<div class="menu">
    {% load static %}
    <h1 class="title">Signup</h1>
    {{ error_message }}
    <form method="POST">
        {% csrf_token %}
        <input class="username" type="text" name="username" placeholder="Username" required>
        <br>
        <input class="email" type="text" name="email" placeholder="Email" required>
        <br>
        <input class="pass" type="password" name="password" placeholder="Password" required>
        <br>
        <input class="repass" type="password" name="repassword" placeholder="RePassword" required>
        <br>
        <button class="submit" type="submit">Signup</button>
    </form>
    <a class="redirect" href="{% url 'login' %}">アカウントをお持ちの方はこちら</a>

</div>

{% endblock content %}
